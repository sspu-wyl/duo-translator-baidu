name: Baidu fork build

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Use public build defaults (no personal credentials)
        run: cp .env.example .env
      - run: pnpm install --frozen-lockfile
      - run: pnpm i18n:check
      - run: pnpm compile
      - run: pnpm test
      - run: pnpm zip
      - run: pnpm build:firefox
      - run: pnpm e2e:build
      - name: Check background/content bundle separation
        run: pnpm e2e --grep @bundle
      - uses: actions/upload-artifact@v4
        with:
          name: duo-translator-2.2.6-baidu.1-chrome
          path: .output/duo-translator-2.2.6-baidu.1-chrome.zip
